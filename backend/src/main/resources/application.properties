spring.application.name=CalTalkBackend
spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties]
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/caltalk}
spring.datasource.username=${DB_USERNAME:caltalk}
spring.datasource.password=${DB_PASSWORD:caltalk-local-password}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

caltalk.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
caltalk.frontend-origin=${FRONTEND_ORIGIN:http://localhost:5173}
caltalk.oauth.enabled=${SOCIAL_LOGIN_ENABLED:false}
caltalk.oauth.google.client-id=${GOOGLE_CLIENT_ID:}
caltalk.oauth.google.client-secret=${GOOGLE_CLIENT_SECRET:}
caltalk.oauth.kakao.client-id=${KAKAO_CLIENT_ID:}
caltalk.oauth.kakao.client-secret=${KAKAO_CLIENT_SECRET:}
caltalk.oauth.naver.client-id=${NAVER_CLIENT_ID:}
caltalk.oauth.naver.client-secret=${NAVER_CLIENT_SECRET:}
caltalk.chatbot.kakao.enabled=${KAKAO_CHATBOT_ENABLED:false}
caltalk.chatbot.kakao.skill-secret=${KAKAO_CHATBOT_SKILL_SECRET:}
caltalk.chatbot.kakao.identity-secret=${KAKAO_IDENTITY_HMAC_SECRET:}
caltalk.chatbot.kakao.logical-bot-key=${KAKAO_LOGICAL_BOT_KEY:caltalk-main}
caltalk.ai.ollama.enabled=${OLLAMA_ENABLED:true}
caltalk.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
caltalk.ai.ollama.model=${OLLAMA_MODEL:qwen3:8b}
caltalk.ai.ollama.timeout=${OLLAMA_TIMEOUT:8s}
caltalk.ai.openai.enabled=${OPENAI_FALLBACK_ENABLED:false}
caltalk.ai.openai.api-key=${OPENAI_API_KEY:}
caltalk.ai.openai.model=${OPENAI_MODEL:gpt-5.6-sol}
caltalk.ai.openai.timeout=${OPENAI_TIMEOUT:8s}
caltalk.ai.openai.hourly-limit=${OPENAI_HOURLY_LIMIT:20}
caltalk.push.vapid.public-key=${WEB_PUSH_VAPID_PUBLIC_KEY:}
caltalk.push.vapid.private-key=${WEB_PUSH_VAPID_PRIVATE_KEY:}
caltalk.push.vapid.subject=${WEB_PUSH_VAPID_SUBJECT:mailto:caltalk-local@example.com}
caltalk.push.dispatch-interval=${WEB_PUSH_DISPATCH_INTERVAL:30000}

spring.session.timeout=12h
spring.session.jdbc.initialize-schema=never

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

server.servlet.session.cookie.name=CALTALK_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.path=/
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.timeout=12h

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
