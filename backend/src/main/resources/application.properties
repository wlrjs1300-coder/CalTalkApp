spring.application.name=CalTalkBackend

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/caltalk}
spring.datasource.username=${DB_USERNAME:caltalk}
spring.datasource.password=${DB_PASSWORD:caltalk-local-password}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

caltalk.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

spring.session.timeout=12h
spring.session.jdbc.initialize-schema=never

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

server.servlet.session.cookie.name=CALTALK_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.path=/
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.timeout=12h

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
