services:
  - type: pserv
    name: caltalk-backend
    runtime: docker
    plan: starter
    region: singapore
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        fromDatabase:
          name: caltalk-postgres
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: caltalk-postgres
          property: password
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: caltalk-redis
          property: connectionString
      - key: SESSION_COOKIE_SECURE
        value: true
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: SOCIAL_LOGIN_ENABLED
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: KAKAO_CLIENT_ID
        sync: false
      - key: KAKAO_CLIENT_SECRET
        sync: false
      - key: NAVER_CLIENT_ID
        sync: false
      - key: NAVER_CLIENT_SECRET
        sync: false
      - key: KAKAO_CHATBOT_ENABLED
        value: true
      - key: KAKAO_CHATBOT_SKILL_SECRET
        sync: false
      - key: KAKAO_IDENTITY_HMAC_SECRET
        generateValue: true
      - key: KAKAO_LOGICAL_BOT_KEY
        value: caltalk-main
      - key: OLLAMA_ENABLED
        value: false
      - key: OLLAMA_MODEL
        value: qwen3:8b
      - key: OLLAMA_TIMEOUT
        value: 8s
      - key: OPENAI_FALLBACK_ENABLED
        value: true
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.6-sol
      - key: OPENAI_TIMEOUT
        value: 8s
      - key: OPENAI_HOURLY_LIMIT
        value: 20
      - key: WEB_PUSH_VAPID_PUBLIC_KEY
        sync: false
      - key: WEB_PUSH_VAPID_PRIVATE_KEY
        sync: false
      - key: WEB_PUSH_VAPID_SUBJECT
        sync: false
      - key: WEB_PUSH_DISPATCH_INTERVAL
        value: 30000
      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=75.0

  - type: keyvalue
    name: caltalk-redis
    plan: starter
    region: singapore
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru
    persistenceMode: off

  - type: web
    name: caltalk-frontend
    runtime: docker
    plan: starter
    region: singapore
    rootDir: frontend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: BACKEND_ORIGIN
        fromService:
          type: pserv
          name: caltalk-backend
          property: hostport

databases:
  - name: caltalk-postgres
    plan: basic-256mb
    region: singapore
    databaseName: caltalk
    user: caltalk
    ipAllowList: []
